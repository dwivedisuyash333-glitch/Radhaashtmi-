<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10050b">
  <title>श्री राधे • राधाष्टमी</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="temple-frame" aria-hidden="true">
      <div class="arch arch-left"></div>
      <div class="arch arch-right"></div>
      <span class="frame-flower f1">✦</span>
      <span class="frame-flower f2">✦</span>
      <span class="frame-flower f3">❈</span>
      <span class="frame-flower f4">❈</span>
      <span class="frame-center top">ॐ</span>
      <span class="frame-center bottom">श्री राधे</span>
    </div>

    <main class="content">
      <p class="small-heading">श्री राधे</p>

      <section class="art-card">
        <div class="art-halo"></div>
        <canvas id="radhaCanvas" aria-label="Radha Rani pixel-by-pixel reveal"></canvas>
      </section>

      <section class="message-area" aria-live="polite">
        <h1 id="radheTitle" class="devanagari">श्री राधे</h1>

        <div id="greeting" class="message">
          <span>राधाष्टमी के पावन अवसर पर</span>
          <span>आपको हार्दिक शुभकामनाएँ।</span>
        </div>

        <div id="blessing" class="message">
          <span>राधा रानी की कृपा</span>
          <span>सदैव आप दोनों पर बनी रहे,</span>
          <span>और आप दोनों को यूँ ही</span>
          <span>हमेशा साथ रखें।</span>
        </div>

        <div id="anniversary" class="message special">
          <span>स्वयं राधारानी की ओर से</span>
          <span>आप दोनों को 5 महीने पूरे होने पर</span>
          <span>ढेरों शुभकामनाएँ।</span>
        </div>
      </section>
    </main>

    <div id="petals" class="petals" aria-hidden="true"></div>
  </div>

  <!-- Generated by convert_to_pixels.py from the supplied Radha Rani photo. -->
  <script src="radha_pixels.js"></script>
  <script src="script.js"></script>
</body>
</html>
