<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080108">
<title>श्री राधे • राधाष्टमी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="temple-frame" aria-hidden="true">
    <div class="frame-inner"></div>
    <div class="crest top"><span>✦</span><i></i><b>ॐ</b><i></i><span>✦</span></div>
    <div class="crest bottom"><span>❈</span><i></i><b>॥ श्री राधे ॥</b><i></i><span>❈</span></div>
    <div class="corner tl">❖</div><div class="corner tr">❖</div><div class="corner bl">❖</div><div class="corner br">❖</div>
    <div class="pillar left"><div class="cap">✦ ❈ ✦</div><div class="shaft">ॐ<br>❖<br>श्री<br>❖<br>राधे<br>❖</div><div class="base">❈ ✦ ❈</div></div>
    <div class="pillar right"><div class="cap">✦ ❈ ✦</div><div class="shaft">ॐ<br>❖<br>राधे<br>❖<br>श्री<br>❖</div><div class="base">❈ ✦ ❈</div></div>
  </div>

  <main class="content">
    <section class="hero">
      <div class="om">ॐ</div>
      <div class="radha-stage">
        <div class="aura"></div>
        <canvas id="radhaCanvas" aria-label="Radha Rani pixel-by-pixel artwork"></canvas>
      </div>
      <h1 id="radheTitle">श्री राधे</h1>
    </section>

    <section class="message-stage">
      <div class="message-card" id="messageCard">
        <div class="card-top">॥ श्री राधे ॥</div>
        <p id="messageText"></p>
        <div class="card-bottom">❈</div>
      </div>
    </section>
    <div id="petals" aria-hidden="true"></div>
  </main>
</div>
<script src="radha_pixels.js"></script>
<script src="script.js"></script>
</body>
</html>
