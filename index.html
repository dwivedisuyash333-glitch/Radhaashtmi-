<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12060c">
  <title>श्री राधे • राधाष्टमी</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="corner c-tl">❈</div>
    <div class="corner c-tr">❈</div>
    <div class="corner c-bl">❈</div>
    <div class="corner c-br">❈</div>

    <main class="content">
      <div class="eyebrow">श्री राधे</div>

      <section class="art-wrap" aria-label="Radha Rani pixel reveal">
        <canvas id="radhaCanvas"></canvas>
      </section>

      <section class="messages" aria-live="polite">
        <div id="radhe" class="radhe">श्री राधे</div>

        <div id="greeting" class="message">
          <span>राधाष्टमी के पावन अवसर पर</span>
          <span>आपको हार्दिक शुभकामनाएँ।</span>
        </div>

        <div id="blessing" class="message">
          <span>राधा रानी की कृपा</span>
          <span>सदैव आप दोनों पर बनी रहे,</span>
          <span>और आप दोनों को यूँ ही</span>
          <span>हमेशा साथ रखें।</span>
        </div>

        <div id="anniversary" class="message special">
          <span>स्वयं राधारानी की ओर से</span>
          <span>आप दोनों को 5 महीने पूरे होने पर</span>
          <span>ढेरों शुभकामनाएँ।</span>
        </div>
      </section>
    </main>

    <div id="petals" class="petals" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
