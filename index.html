<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>श्री राधे • राधाष्टमी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="temple-page">
  <div class="corner corner-tl">✦</div><div class="corner corner-tr">✦</div>
  <div class="corner corner-bl">✿</div><div class="corner corner-br">✿</div>

  <aside class="pillar pillar-left" aria-hidden="true">
    <div class="capital">❧</div><div class="shaft"></div><div class="base">❧</div>
  </aside>
  <aside class="pillar pillar-right" aria-hidden="true">
    <div class="capital">❧</div><div class="shaft"></div><div class="base">❧</div>
  </aside>

  <main>
    <section class="hero">
      <div class="om">ॐ</div>
      <div class="radha-stage">
        <canvas id="radhaCanvas" aria-label="Radha Rani rendered as pixels"></canvas>
      </div>
      <div id="radheTitle" class="radhe-title">श्री राधे</div>
      <div class="divider">❈ ───── ✦ ───── ❈</div>
    </section>

    <section class="message-section">
      <div id="messageStack" class="message-stack">
        <p class="message active">राधाष्टमी के पावन अवसर पर आपको हार्दिक शुभकामनाएँ।</p>
        <p class="message">राधा रानी की कृपा सदैव आप दोनों पर बनी रहे, और आप दोनों को यूँ ही हमेशा साथ रखें।</p>
        <p class="message">स्वयं राधारानी की ओर से आप दोनों को 5 महीने पूरे होने पर ढेरों शुभकामनाएँ।</p>
      </div>
      <div id="petals" class="petals" aria-hidden="true"></div>
    </section>
  </main>
</div>
<script src="radha_pixels.js"></script>
<script src="script.js"></script>
</body>
</html>
