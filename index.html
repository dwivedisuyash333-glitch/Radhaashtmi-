<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10020e">
<title>श्री राधे • राधाष्टमी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="temple-frame" aria-hidden="true">
    <div class="outer-gold"></div>
    <div class="inner-gold"></div>
    <div class="top-crown"><span>✦</span><i></i><b>ॐ</b><i></i><span>✦</span></div>
    <div class="bottom-crown"><span>❈</span><i></i><b>॥ श्री राधे ॥</b><i></i><span>❈</span></div>
    <div class="corner-ornament tl">❈</div><div class="corner-ornament tr">❈</div>
    <div class="corner-ornament bl">❈</div><div class="corner-ornament br">❈</div>
    <div class="pillar pillar-left"><div class="capital">✦</div><div class="shaft"><span>❖</span><span>ॐ</span><span>❖</span><span>श्री</span><span>❖</span></div><div class="base">✦</div></div>
    <div class="pillar pillar-right"><div class="capital">✦</div><div class="shaft"><span>❖</span><span>राधे</span><span>❖</span><span>श्री</span><span>❖</span></div><div class="base">✦</div></div>
    <div class="side-filigrree left"></div><div class="side-filigrree right"></div>
  </div>

  <main class="content">
    <section class="hero" id="hero">
      <div class="om">ॐ</div>
      <div class="radha-wrap">
        <div class="divine-aura"></div>
        <canvas id="radhaCanvas" aria-label="राधारानी का pixel-by-pixel रूप"></canvas>
      </div>
      <h1 id="radheTitle">श्री राधे</h1>
      <div class="ornament-dot">✦</div>
    </section>

    <section class="message-stage" aria-live="polite">
      <div class="message-card" id="messageCard">
        <div class="card-top">॥ श्री राधे ॥</div>
        <p id="messageText"></p>
        <div class="card-bottom">❈</div>
      </div>
    </section>
    <div id="petals" aria-hidden="true"></div>
  </main>
</div>
<script src="radha_pixels.js"></script>
<script src="script.js"></script>
</body>
</html>
